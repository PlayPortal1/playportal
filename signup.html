<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PlayPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <div class="header-content">
      <a href="index.html" style="text-decoration: none; cursor: pointer;">
  <img src="logo.png" alt="PlayPortal" style="height: 80px; width: auto;">
</a>
      <div class="user-info">
        <div>Create Your Account</div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card" style="max-width: 500px; margin: 3rem auto;">
      <h1 style="font-size: 28px; font-weight: 700; text-align: center; margin: 0 0 0.5rem 0;">Join PlayPortal</h1>
      <p style="text-align: center; color: #64748b; margin: 0 0 2rem 0;">Start your recruiting journey in 60 seconds</p>

      <div style="margin-bottom: 1.5rem;">
        <label>First Name</label>
        <input type="text" id="firstName" placeholder="John">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label>Last Name</label>
        <input type="text" id="lastName" placeholder="Smith">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>

      <div style="margin-bottom: 2rem;">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button onclick="createAccount()" class="btn-primary">CREATE ACCOUNT</button>

      <div style="text-align: center; margin-top: 2rem; padding-top: 1rem; border-top: 2px solid #e2e8f0;">
        <span style="font-size: 12px; color: #64748b;">Already have an account? </span>
        <a href="login.html" style="color: #2563eb; text-decoration: underline; cursor: pointer; font-weight: 600;">Sign in</a>
      </div>

      <div style="background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 1rem; margin-top: 2rem; text-align: center;">
        <div style="font-size: 12px; color: #1e40af; line-height: 1.6;">
          After creating your account, you'll log in and complete your profile in just 7 easy steps.
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClVcliLB_iOqbXCilNYSAclIOK5TyBJz0",
      authDomain: "playportal-bf6d4.firebaseapp.com",
      projectId: "playportal-bf6d4",
      storageBucket: "playportal-bf6d4.firebasestorage.app",
      messagingSenderId: "419889829572",
      appId: "1:419889829572:web:f341cf03579997830c5b91",
      databaseURL: "https://playportal-bf6d4-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    window.createAccount = function() {
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!firstName || !lastName || !email || !password) {
        alert('Please fill in all fields');
        return;
      }

      createUserWithEmailAndPassword(auth, email, password)
        .then(userCredential => {
          const userId = userCredential.user.uid;
          
          // Save basic info
          set(ref(database, 'users/' + userId), {
            firstName: firstName,
            lastName: lastName,
            email: email,
            createdAt: new Date().toISOString(),
            status: 'pending'
          });

          alert('✓ Account created! Starting your profile...');
window.location.href = 'profile-setup.html';
        })
        .catch(error => {
          alert('Error: ' + error.message);
        });
    };
  </script>

</body>
</html>
