<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PlayPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <div class="header-content">
      <div class="logo">🎾 PlayPortal</div>
      <div class="user-info">
        <div id="userStatus">Not logged in</div>
      </div>
    </div>
  </div>

  <div id="loginScreen" class="container">
    <div class="card" style="max-width: 500px; margin: 3rem auto;">
      <h1 style="font-size: 28px; font-weight: 700; text-align: center; margin: 0 0 0.5rem 0;">Sign In</h1>
      <p style="text-align: center; color: #64748b; margin: 0 0 2rem 0;">Enter your credentials</p>

      <div style="margin-bottom: 1.5rem;">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="test@example.com">
      </div>

      <div style="margin-bottom: 2rem;">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>

      <button onclick="handleLogin()" class="btn-primary">SIGN IN</button>

      <div style="text-align: center; margin-top: 2rem; padding-top: 1rem; border-top: 2px solid #e2e8f0;">
        <span style="font-size: 12px; color: #64748b;">Don't have an account? </span>
        <a href="signup.html" style="color: #2563eb; text-decoration: underline;">Create one</a>
      </div>

      <div style="background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 1rem; margin-top: 2rem; text-align: center;">
        <div style="font-size: 12px; font-weight: 600; color: #1e40af; margin-bottom: 0.75rem;">Test Credentials:</div>
        <div style="font-size: 13px; color: #1e40af;">
          <strong>Email:</strong> test@example.com<br>
          <strong>Password:</strong> Test123456
        </div>
      </div>
    </div>
  </div>

  <div id="dashboardScreen" class="container hidden">
    <div class="card">
      <h1>Dashboard</h1>
      <p id="userEmail"></p>
      <button onclick="handleLogout()" class="btn-secondary">LOG OUT</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClVcliLB_iOqbXCilNYSAclIOK5TyBJz0",
      authDomain: "playportal-bf6d4.firebaseapp.com",
      projectId: "playportal-bf6d4",
      storageBucket: "playportal-bf6d4.firebasestorage.app",
      messagingSenderId: "419889829572",
      appId: "1:419889829572:web:f341cf03579997830c5b91"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleLogin = function() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        alert('Please enter email and password');
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then(userCredential => {
          window.location.href = 'profile-setup.html';
        })
        .catch(error => {
          alert('Login failed: ' + error.message);
        });
    };

    window.handleLogout = function() {
      signOut(auth).then(() => {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('dashboardScreen').classList.add('hidden');
        document.getElementById('loginEmail').value = '';
        document.getElementById('loginPassword').value = '';
      });
    };

    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        document.getElementById('userEmail').textContent = 'Welcome, ' + user.email;
        document.getElementById('userStatus').textContent = '✓ ' + user.email;
      }
    });
  </script>

</body>
</html>
