<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile - PlayPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <div class="header-content">
      <div class="logo">🎾 PlayPortal</div>
      <div class="user-info">
        <div id="userEmail">Loading...</div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card" style="max-width: 700px; margin: 0 auto;">
      <h1 style="text-align: center; margin-bottom: 2rem;">Complete Your Profile</h1>
      <div id="stepContent">Loading...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClVcliLB_iOqbXCilNYSAclIOK5TyBJz0",
      authDomain: "playportal-bf6d4.firebaseapp.com",
      projectId: "playportal-bf6d4",
      storageBucket: "playportal-bf6d4.firebasestorage.app",
      messagingSenderId: "419889829572",
      appId: "1:419889829572:web:f341cf03579997830c5b91",
      databaseURL: "https://playportal-bf6d4-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentStep = 1;
    let currentUser = null;
    let userData = {};
    let selectedOpportunity = 'undergraduate';

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      document.getElementById('userEmail').textContent = '✓ ' + user.email;
      
      get(ref(database, 'users/' + user.uid)).then(snapshot => {
        userData = snapshot.val() || {};
        if (userData.opportunityType) {
          selectedOpportunity = userData.opportunityType;
        }
        showStep();
      });
    });

    window.nextStep = function() {
      if (!validateStep()) return;
      saveStep();
      if (currentStep < 7) {
        currentStep++;
        showStep();
      } else {
        completeProfile();
      }
    };

    window.previousStep = function() {
      if (currentStep > 1) {
        currentStep--;
        showStep();
      }
    };

    window.selectOpportunity = function(opp) {
      selectedOpportunity = opp;
      showStep();
    };

    window.selectPackage = function(pkg) {
      userData.package = pkg;
      showStep();
    };

    function validateStep() {
      if (currentStep === 1) {
        if (!document.getElementById('firstName')?.value || !document.getElementById('lastName')?.value) {
          alert('Please fill all fields');
          return false;
        }
      }
      if (currentStep === 3) {
        if (!document.getElementById('school')?.value || !document.getElementById('gpa')?.value) {
          alert('Please fill all fields');
          return false;
        }
      }
      if (currentStep === 4) {
        if (!document.getElementById('utr')?.value || !document.getElementById('wtn')?.value) {
          alert('Please fill all fields');
          return false;
        }
      }
      if (currentStep === 5) {
        if (!userData.package) {
          alert('Please select a package');
          return false;
        }
        const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
        if (userData.package !== 'premium' && checked === 0) {
          alert('Please select at least one division');
          return false;
        }
      }
      if (currentStep === 6) {
        alert('⏳ Waiting for admin approval. You cannot proceed yet.');
        return false;
      }
      return true;
    }

    function saveStep() {
      if (currentStep === 1) {
        userData.firstName = document.getElementById('firstName').value;
        userData.lastName = document.getElementById('lastName').value;
      }
      if (currentStep === 2) {
        userData.opportunityType = selectedOpportunity;
      }
      if (currentStep === 3) {
        userData.school = document.getElementById('school').value;
        userData.gpa = document.getElementById('gpa').value;
      }
      if (currentStep === 4) {
        userData.utr = document.getElementById('utr').value;
        userData.wtn = document.getElementById('wtn').value;
        userData.tennisAchievements = document.getElementById('tennisAchievements')?.value || '';
      }
      if (currentStep === 5) {
        const selected = [];
        document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
          selected.push(cb.value);
        });
        userData.selectedDivisions = userData.package === 'premium' ? ['d1', 'd2', 'd3', 'naia', 'juco'] : selected;
      }
    }

    function showStep() {
      let html = '';

      if (currentStep === 1) {
        html = `
          <h2>Step 1: Personal Information</h2>
          <div style="margin-bottom: 1rem;">
            <label>First Name</label>
            <input type="text" id="firstName" value="${userData.firstName || ''}" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div style="margin-bottom: 1rem;">
            <label>Last Name</label>
            <input type="text" id="lastName" value="${userData.lastName || ''}" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div style="margin-bottom: 1rem;">
            <label>Date of Birth</label>
            <input type="date" id="dob" value="${userData.dob || ''}" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <button onclick="window.nextStep()" class="btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 1rem;">NEXT →</button>
        `;
      }

      if (currentStep === 2) {
        html = `
          <h2>Step 2: Opportunity Type</h2>
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            <button onclick="selectOpportunity('undergraduate')" style="padding: 1rem; border: ${selectedOpportunity === 'undergraduate' ? '3px solid #2563eb' : '1px solid #ccc'}; border-radius: 8px; background: ${selectedOpportunity === 'undergraduate' ? '#f0f7ff' : 'white'}; cursor: pointer;">Undergraduate Playing</button>
            <button onclick="selectOpportunity('transfer')" style="padding: 1rem; border: ${selectedOpportunity === 'transfer' ? '3px solid #2563eb' : '1px solid #ccc'}; border-radius: 8px; background: ${selectedOpportunity === 'transfer' ? '#f0f7ff' : 'white'}; cursor: pointer;">Transfer Playing</button>
            <button onclick="selectOpportunity('graduate')" style="padding: 1rem; border: ${selectedOpportunity === 'graduate' ? '3px solid #2563eb' : '1px solid #ccc'}; border-radius: 8px; background: ${selectedOpportunity === 'graduate' ? '#f0f7ff' : 'white'}; cursor: pointer;">Graduate Playing</button>
            <button onclick="selectOpportunity('coach')" style="padding: 1rem; border: ${selectedOpportunity === 'coach' ? '3px solid #2563eb' : '1px solid #ccc'}; border-radius: 8px; background: ${selectedOpportunity === 'coach' ? '#f0f7ff' : 'white'}; cursor: pointer;">Graduate Assistant Coach</button>
          </div>
          <div style="margin-top: 1rem; display: flex; gap: 1rem;">
            <button onclick="window.previousStep()" class="btn-secondary" style="flex: 1; padding: 0.75rem;">← BACK</button>
            <button onclick="window.nextStep()" class="btn-primary" style="flex: 1; padding: 0.75rem;">NEXT →</button>
          </div>
        `;
      }

      if (currentStep === 3) {
        html = `
          <h2>Step 3: Academic Info</h2>
          <div style="margin-bottom: 1rem;">
            <label>School/University</label>
            <input type="text" id="school" value="${userData.school || ''}" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div style="margin-bottom: 1rem;">
            <label>GPA</label>
            <input type="number" id="gpa" step="0.01" value="${userData.gpa || ''}" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div style="margin-top: 1rem; display: flex; gap: 1rem;">
            <button onclick="window.previousStep()" class="btn-secondary" style="flex: 1; padding: 0.75rem;">← BACK</button>
            <button onclick="window.nextStep()" class="btn-primary" style="flex: 1; padding: 0.75rem;">NEXT →</button>
          </div>
        `;
      }

      if (currentStep === 4) {
        html = `
          <h2>Step 4: Tennis Info</h2>
          <div style="margin-bottom: 1rem;">
            <label>UTR Rating</label>
            <input type="number" id="utr" step="0.1" value="${userData.utr || ''}" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div style="margin-bottom: 1rem;">
            <label>WTN Rating</label>
            <input type="number" id="wtn" step="0.1" value="${userData.wtn || ''}" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div style="margin-bottom: 1rem;">
            <label>Tennis Achievements</label>
            <textarea id="tennisAchievements" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; height: 80px;">${userData.tennisAchievements || ''}</textarea>
          </div>
          <div style="margin-top: 1rem; display: flex; gap: 1rem;">
            <button onclick="window.previousStep()" class="btn-secondary" style="flex: 1; padding: 0.75rem;">← BACK</button>
            <button onclick="window.nextStep()" class="btn-primary" style="flex: 1; padding: 0.75rem;">NEXT →</button>
          </div>
        `;
      }

      if (currentStep === 5) {
        html = `
          <h2>Step 5: Package Selection</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
            <button onclick="selectPackage('basic')" style="padding: 1.5rem; border: ${userData.package === 'basic' ? '3px solid #ff6b35' : '1px solid #ccc'}; border-radius: 8px; background: ${userData.package === 'basic' ? '#fff7ed' : 'white'}; cursor: pointer;"><strong>BASIC</strong><br>$99<br><small>1 Division</small></button>
            <button onclick="selectPackage('standard')" style="padding: 1.5rem; border: ${userData.package === 'standard' ? '3px solid #ff6b35' : '1px solid #ccc'}; border-radius: 8px; background: ${userData.package === 'standard' ? '#fff7ed' : 'white'}; cursor: pointer;"><strong>STANDARD</strong><br>$150<br><small>3 Divisions</small></button>
            <button onclick="selectPackage('premium')" style="padding: 1.5rem; border: ${userData.package === 'premium' ? '3px solid #ff6b35' : '1px solid #ccc'}; border-radius: 8px; background: ${userData.package === 'premium' ? '#fff7ed' : 'white'}; cursor: pointer;"><strong>PREMIUM</strong><br>$215<br><small>All (D1, D2, D3, NAIA, JUCO)</small></button>
          </div>
          
          ${userData.package === 'basic' || userData.package === 'standard' ? `
            <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
              <p><strong>Select divisions:</strong></p>
              <label style="display: block; margin: 0.5rem 0;"><input type="checkbox" value="d1"> NCAA DIVISION 1</label>
              <label style="display: block; margin: 0.5rem 0;"><input type="checkbox" value="d2"> NCAA DIVISION 2</label>
              <label style="display: block; margin: 0.5rem 0;"><input type="checkbox" value="d3"> NCAA DIVISION 3</label>
              <label style="display: block; margin: 0.5rem 0;"><input type="checkbox" value="naia"> NAIA</label>
              <label style="display: block; margin: 0.5rem 0;"><input type="checkbox" value="juco"> JUCO</label>
            </div>
          ` : ''}

          <div style="display: flex; gap: 1rem;">
            <button onclick="window.previousStep()" class="btn-secondary" style="flex: 1; padding: 0.75rem;">← BACK</button>
            <button onclick="window.nextStep()" class="btn-primary" style="flex: 1; padding: 0.75rem;">NEXT →</button>
          </div>
        `;
      }

      if (currentStep === 6) {
        html = `
          <h2>Step 6: Email Review</h2>
          <div style="background: #dbeafe; padding: 2rem; border-radius: 8px; text-align: center;">
            <p style="font-size: 3rem;">✉️</p>
            <p><strong>Your email is being reviewed by our team.</strong></p>
            <p style="color: #666;">We'll notify you via email when it's ready for approval.</p>
            <p style="color: #666; font-size: 12px;">You cannot proceed until admin approval.</p>
          </div>
          <div style="margin-top: 1rem; display: flex; gap: 1rem;">
            <button onclick="window.previousStep()" class="btn-secondary" style="flex: 1; padding: 0.75rem;">← BACK</button>
            <button onclick="alert('Cannot proceed - waiting for admin approval')" class="btn-primary" style="flex: 1; padding: 0.75rem; opacity: 0.5;" disabled>NEXT →</button>
          </div>
        `;
      }

      if (currentStep === 7) {
        html = `
          <h2>Step 7: Campaign Status</h2>
          <div style="background: #f0fdf4; padding: 2rem; border-radius: 8px; text-align: center;">
            <p style="font-size: 3rem;">🚀</p>
            <p><strong>Your campaign is in progress!</strong></p>
            <p style="color: #666;">Emails are being sent to coaches.</p>
            <p style="color: #666; font-size: 12px;">You'll be notified when complete, then proceed to payment.</p>
          </div>
          <div style="margin-top: 1rem; display: flex; gap: 1rem;">
            <button onclick="window.previousStep()" class="btn-secondary" style="flex: 1; padding: 0.75rem;">← BACK</button>
            <button onclick="alert('Waiting for admin to confirm emails sent')" class="btn-primary" style="flex: 1; padding: 0.75rem; opacity: 0.5;" disabled>NEXT →</button>
          </div>
        `;
      }

      document.getElementById('stepContent').innerHTML = html;
    }

    function completeProfile() {
      update(ref(database, 'users/' + currentUser.uid), userData).then(() => {
        alert('✓ Profile complete! Proceeding to payment...');
        window.location.href = 'payment.html';
      });
    }
  </script>

</body>
</html>
