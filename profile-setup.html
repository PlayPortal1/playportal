<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile - PlayPortal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 13px;
      color: #0f172a;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    textarea {
      resize: vertical;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-content">
      <div class="logo">🎾 PlayPortal</div>
      <div class="user-info">
        <div id="userEmail">Loading...</div>
        <div style="font-size: 12px; color: #64748b; margin-top: 0.25rem;" id="stepLabel">Step 1 of 7</div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card" style="max-width: 700px; margin: 0 auto;">
      
      <div class="card-header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h1 style="font-size: 24px; font-weight: 700; margin: 0;">Complete Your Profile</h1>
          <div style="text-align: right;">
            <div style="font-size: 24px; font-weight: 700; color: #2563eb;" id="stepNum">1</div>
            <div style="font-size: 12px; color: #64748b;">of 7</div>
          </div>
        </div>

        <div style="height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
          <div id="progressBar" style="height: 100%; background: #2563eb; width: 14.28%; transition: width 0.3s;"></div>
        </div>
      </div>

      <h2 id="stepTitle" style="font-size: 18px; font-weight: 600; color: #0f172a; margin: 2rem 0 1.5rem 0;"></h2>

      <div id="stepContent" style="margin-bottom: 2rem; min-height: 200px;"></div>

      <div style="display: flex; justify-content: space-between; gap: 1rem; border-top: 2px solid #e2e8f0; padding-top: 2rem;">
        <button onclick="previousStep()" id="prevBtn" class="btn-secondary" style="display: none;">← PREVIOUS</button>
        <button onclick="nextStep()" id="nextBtn" class="btn-primary" style="margin-left: auto;">NEXT STEP →</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClVcliLB_iOqbXCilNYSAclIOK5TyBJz0",
      authDomain: "playportal-bf6d4.firebaseapp.com",
      projectId: "playportal-bf6d4",
      storageBucket: "playportal-bf6d4.firebasestorage.app",
      messagingSenderId: "419889829572",
      appId: "1:419889829572:web:f341cf03579997830c5b91",
      databaseURL: "https://playportal-bf6d4-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentStep = 1;
    let currentUser = null;
    let userData = {};
    let selectedOpportunity = 'undergraduate';

    window.nextStep = function() {
      if (!validateStep()) return;
      saveStep();
      if (currentStep < 7) {
        currentStep++;
        displayStep();
      } else {
        completeProfile();
      }
    };

    window.previousStep = function() {
      if (currentStep > 1) {
        currentStep--;
        displayStep();
      }
    };

    window.selectOpportunity = function(value) {
      selectedOpportunity = value;
      document.querySelectorAll('input[name="opportunity"]').forEach(el => {
        el.checked = el.value === value;
      });
    };

    window.selectPackage = function(pkg) {
      userData.package = pkg;
      updatePackageDisplay(pkg);
      displayStep();
    };

    function updatePackageDisplay(pkg) {
      const cards = document.querySelectorAll('[data-package]');
      cards.forEach(card => {
        if (card.dataset.package === pkg) {
          card.style.borderColor = '#ff6b35';
          card.style.background = '#fff7ed';
        } else {
          card.style.borderColor = '#cbd5e1';
          card.style.background = 'white';
        }
      });
    }

    function validateStep() {
      const step = currentStep;
      
      if (step === 1) {
        if (!document.getElementById('firstName')?.value || !document.getElementById('lastName')?.value || 
            !document.getElementById('dob')?.value || document.getElementById('gender')?.value === 'Select Gender') {
          alert('Please fill in all fields');
          return false;
        }
      }
      
      if (step === 3) {
        if (!document.getElementById('school')?.value || !document.getElementById('gradYear')?.value || 
            !document.getElementById('gpa')?.value) {
          alert('Please fill in all fields');
          return false;
        }
      }
      
      if (step === 4) {
        if (!document.getElementById('yearsPlaying')?.value || !document.getElementById('utr')?.value || 
            !document.getElementById('wtn')?.value) {
          alert('Please fill in all fields');
          return false;
        }
      }

      if (step === 5) {
        if (!userData.package) {
          alert('Please select a package');
          return false;
        }
        const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
        if (userData.package !== 'premium' && checked === 0) {
          alert('Please select at least one division');
          return false;
        }
      }

      if (step === 6) {
        alert('⏳ Your email is being reviewed by our team. You cannot proceed until it\'s approved. We\'ll notify you via email when it\'s ready!');
        return false;
      }

      return true;
    }

    function saveStep() {
      const step = currentStep;
      
      if (step === 1) {
        userData.firstName = document.getElementById('firstName')?.value;
        userData.lastName = document.getElementById('lastName')?.value;
        userData.dob = document.getElementById('dob')?.value;
        userData.gender = document.getElementById('gender')?.value;
      }
      
      if (step === 2) {
        userData.opportunityType = selectedOpportunity;
      }
      
      if (step === 3) {
        userData.school = document.getElementById('school')?.value;
        userData.gradYear = document.getElementById('gradYear')?.value;
        userData.gpa = document.getElementById('gpa')?.value;
        userData.academicAchievements = document.getElementById('achievements')?.value || '';
        
        if (selectedOpportunity === 'undergraduate') {
          userData.sat = document.getElementById('sat')?.value || '';
        } else if (selectedOpportunity === 'transfer') {
          userData.currentDegree = document.getElementById('currentDegree')?.value || '';
        } else {
          userData.degreeStudied = document.getElementById('degreeStudied')?.value || '';
          userData.degreeWantToStudy = document.getElementById('degreeWantToStudy')?.value || '';
        }
      }
      
      if (step === 4) {
        userData.yearsPlaying = document.getElementById('yearsPlaying')?.value;
        userData.playingHand = document.getElementById('playingHand')?.value;
        userData.utr = document.getElementById('utr')?.value;
        userData.wtn = document.getElementById('wtn')?.value;
        userData.tennisAchievements = document.getElementById('tennisAchievements')?.value || '';
      }

      if (step === 5) {
        const selected = [];
        document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
          selected.push(cb.value);
        });
        userData.selectedDivisions = userData.package === 'premium' ? ['d1', 'd2', 'd3', 'naia', 'juco'] : selected;
      }
    }

    function displayStep() {
      let title = '';
      let html = '';

      document.getElementById('stepNum').textContent = currentStep;
      document.getElementById('stepLabel').textContent = 'Step ' + currentStep + ' of 7';
      document.getElementById('progressBar').style.width = ((currentStep - 1) / 6 * 100) + '%';
      document.getElementById('prevBtn').style.display = currentStep === 1 ? 'none' : 'block';
      
      let nextBtnText = 'NEXT STEP →';
      if (currentStep === 5) nextBtnText = 'NEXT STEP →';
      if (currentStep === 6) nextBtnText = 'NEXT STEP →';
      if (currentStep === 7) nextBtnText = 'COMPLETE & PAY →';
      
      document.getElementById('nextBtn').textContent = nextBtnText;
      document.getElementById('nextBtn').disabled = currentStep === 6;
      if (currentStep === 6) {
        document.getElementById('nextBtn').style.opacity = '0.5';
        document.getElementById('nextBtn').style.cursor = 'not-allowed';
      } else {
        document.getElementById('nextBtn').style.opacity = '1';
        document.getElementById('nextBtn').style.cursor = 'pointer';
      }

      // STEP 1: Personal Info
      if (currentStep === 1) {
        title = 'Personal Information';
        html = `
          <div class="grid-2">
            <div>
              <label>First Name</label>
              <input type="text" id="firstName" placeholder="John" value="${userData.firstName || ''}">
            </div>
            <div>
              <label>Last Name</label>
              <input type="text" id="lastName" placeholder="Smith" value="${userData.lastName || ''}">
            </div>
            <div>
              <label>Date of Birth</label>
              <input type="date" id="dob" value="${userData.dob || ''}">
            </div>
            <div>
              <label>Gender</label>
              <select id="gender">
                <option ${userData.gender === 'Select Gender' || !userData.gender ? 'selected' : ''}>Select Gender</option>
                <option ${userData.gender === 'Male' ? 'selected' : ''}>Male</option>
                <option ${userData.gender === 'Female' ? 'selected' : ''}>Female</option>
              </select>
            </div>
          </div>
        `;
      }

      // STEP 2: Opportunity Type
      if (currentStep === 2) {
        title = 'Opportunity Type';
        html = `
          <p style="font-size: 14px; color: #475569; margin-bottom: 1.5rem;">Which opportunity are you seeking?</p>
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div style="border: 2px solid #2563eb; background: #f0f7ff; border-radius: 12px; padding: 1.5rem; cursor: pointer;" onclick="selectOpportunity('undergraduate')">
              <input type="radio" name="opportunity" value="undergraduate" ${selectedOpportunity === 'undergraduate' ? 'checked' : ''}>
              <label style="cursor: pointer; margin: 0; text-transform: none; font-weight: 700; display: inline; margin-left: 0.5rem;">Undergraduate Playing</label>
              <p style="font-size: 12px; color: #64748b; margin: 0.5rem 0 0 1.5rem;">For high school students seeking to play at college</p>
            </div>
            <div style="border: 2px solid #cbd5e1; border-radius: 12px; padding: 1.5rem; cursor: pointer;" onclick="selectOpportunity('transfer')">
              <input type="radio" name="opportunity" value="transfer" ${selectedOpportunity === 'transfer' ? 'checked' : ''}>
              <label style="cursor: pointer; margin: 0; text-transform: none; font-weight: 700; display: inline; margin-left: 0.5rem;">Transfer Playing</label>
              <p style="font-size: 12px; color: #64748b; margin: 0.5rem 0 0 1.5rem;">For college students transferring to another school</p>
            </div>
            <div style="border: 2px solid #cbd5e1; border-radius: 12px; padding: 1.5rem; cursor: pointer;" onclick="selectOpportunity('graduate')">
              <input type="radio" name="opportunity" value="graduate" ${selectedOpportunity === 'graduate' ? 'checked' : ''}>
              <label style="cursor: pointer; margin: 0; text-transform: none; font-weight: 700; display: inline; margin-left: 0.5rem;">Graduate Playing</label>
              <p style="font-size: 12px; color: #64748b; margin: 0.5rem 0 0 1.5rem;">For college graduates pursuing graduate degrees</p>
            </div>
            <div style="border: 2px solid #cbd5e1; border-radius: 12px; padding: 1.5rem; cursor: pointer;" onclick="selectOpportunity('coach')">
              <input type="radio" name="opportunity" value="coach" ${selectedOpportunity === 'coach' ? 'checked' : ''}>
              <label style="cursor: pointer; margin: 0; text-transform: none; font-weight: 700; display: inline; margin-left: 0.5rem;">Graduate Assistant Coach</label>
              <p style="font-size: 12px; color: #64748b; margin: 0.5rem 0 0 1.5rem;">Seeking coaching positions while studying</p>
            </div>
          </div>
        `;
      }

      // STEP 3: Academic Info
      if (currentStep === 3) {
        title = 'Academic Information';
        let schoolLabel = 'High School';
        let extraFields = '';
        
        if (selectedOpportunity === 'transfer') {
          schoolLabel = 'Current University';
          extraFields = `
            <div>
              <label>Degree You're Studying</label>
              <input type="text" id="currentDegree" placeholder="e.g., Business Administration" value="${userData.currentDegree || ''}">
            </div>
          `;
        } else if (selectedOpportunity === 'graduate' || selectedOpportunity === 'coach') {
          extraFields = `
            <div>
              <label>Degree You Studied</label>
              <input type="text" id="degreeStudied" placeholder="e.g., Economics" value="${userData.degreeStudied || ''}">
            </div>
            <div>
              <label>Degree You Want to Study</label>
              <input type="text" id="degreeWantToStudy" placeholder="e.g., MBA" value="${userData.degreeWantToStudy || ''}">
            </div>
          `;
        }
        
        html = `
          <div class="grid-2">
            <div>
              <label>${schoolLabel}</label>
              <input type="text" id="school" placeholder="University Name" value="${userData.school || ''}">
            </div>
            <div>
              <label>Graduation Year</label>
              <input type="number" id="gradYear" placeholder="2024" value="${userData.gradYear || ''}">
            </div>
            <div>
              <label>GPA</label>
              <input type="number" id="gpa" step="0.01" placeholder="3.8" value="${userData.gpa || ''}">
            </div>
            ${selectedOpportunity === 'undergraduate' ? `
            <div>
              <label>SAT Score</label>
              <input type="number" id="sat" placeholder="1390" value="${userData.sat || ''}">
            </div>
            ` : ''}
            ${extraFields}
            <div style="grid-column: 1 / -1;">
              <label>Academic Achievements</label>
              <textarea id="achievements" placeholder="Honors, awards, relevant courses..." style="height: 100px;">${userData.academicAchievements || ''}</textarea>
            </div>
          </div>
        `;
      }

      // STEP 4: Tennis Info
      if (currentStep === 4) {
        title = 'Tennis Information';
        html = `
          <div class="grid-2">
            <div>
              <label>Years Playing Tennis</label>
              <input type="number" id="yearsPlaying" placeholder="8" value="${userData.yearsPlaying || ''}">
            </div>
            <div>
              <label>Playing Hand</label>
              <select id="playingHand">
                <option ${userData.playingHand === 'Right' || !userData.playingHand ? 'selected' : ''}>Right</option>
                <option ${userData.playingHand === 'Left' ? 'selected' : ''}>Left</option>
              </select>
            </div>
            <div>
              <label>UTR Rating</label>
              <input type="number" id="utr" step="0.1" placeholder="10.2" value="${userData.utr || ''}">
            </div>
            <div>
              <label>WTN Rating</label>
              <input type="number" id="wtn" step="0.1" placeholder="13.5" value="${userData.wtn || ''}">
            </div>
            <div style="grid-column: 1 / -1;">
              <label>Tennis Achievements</label>
              <textarea id="tennisAchievements" placeholder="Tournament wins, rankings, titles, records..." style="height: 100px;">${userData.tennisAchievements || ''}</textarea>
            </div>
          </div>
        `;
      }

      // STEP 5: Package Selection
      if (currentStep === 5) {
        title = 'Select Your Package';
        html = `
          <p style="font-size: 14px; color: #475569; margin-bottom: 1.5rem;">Choose your package:</p>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
            <div data-package="basic" style="border: ${userData.package === 'basic' ? '3px solid #ff6b35' : '2px solid #cbd5e1'}; background: ${userData.package === 'basic' ? '#fff7ed' : 'white'}; border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer;" onclick="selectPackage('basic')">
              <div style="font-size: 16px; font-weight: 700; margin-bottom: 0.75rem;">BASIC</div>
              <div style="font-size: 24px; font-weight: 800; color: #2563eb; margin-bottom: 0.5rem;">$99</div>
              <div style="font-size: 12px; color: #64748b;">1 Division</div>
            </div>
            <div data-package="standard" style="border: ${userData.package === 'standard' ? '3px solid #ff6b35' : '2px solid #cbd5e1'}; background: ${userData.package === 'standard' ? '#fff7ed' : 'white'}; border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer;" onclick="selectPackage('standard')">
              <div style="font-size: 11px; font-weight: 700; color: #2563eb; margin-bottom: 0.75rem;">RECOMMENDED</div>
              <div style="font-size: 16px; font-weight: 700; margin-bottom: 0.75rem;">STANDARD</div>
              <div style="font-size: 24px; font-weight: 800; color: #2563eb; margin-bottom: 0.5rem;">$150</div>
              <div style="font-size: 12px; color: #64748b;">3 Divisions</div>
            </div>
            <div data-package="premium" style="border: ${userData.package === 'premium' ? '3px solid #ff6b35' : '2px solid #cbd5e1'}; background: ${userData.package === 'premium' ? '#fff7ed' : 'white'}; border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer;" onclick="selectPackage('premium')">
              <div style="font-size: 16px; font-weight: 700; margin-bottom: 0.75rem;">PREMIUM</div>
              <div style="font-size: 24px; font-weight: 800; color: #2563eb; margin-bottom: 0.5rem;">$215</div>
              <div style="font-size: 12px; color: #64748b;">All Divisions</div>
              <div style="font-size: 11px; color: #64748b; margin-top: 0.75rem;">(NCAA D1, NCAA D2, NCAA D3, NAIA, JUCO)</div>
            </div>
          </div>

          ${userData.package === 'basic' || userData.package === 'standard' ? `
            <div style="background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 1.5rem;">
              <label style="display: block; font-weight: 700; margin-bottom: 1rem; color: #0f172a;">Select divisions to contact:</label>
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <label style="display: flex; align-items: center; cursor: pointer; padding: 0.75rem; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-weight: normal;">
                  <input type="checkbox" value="d1" ${userData.selectedDivisions?.includes('d1') ? 'checked' : ''} style="margin-right: 0.75rem; width: 18px; height: 18px; cursor: pointer;">
                  <span style="font-size: 13px;">NCAA DIVISION 1</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; padding: 0.75rem; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-weight: normal;">
                  <input type="checkbox" value="d2" ${userData.selectedDivisions?.includes('d2') ? 'checked' : ''} style="margin-right: 0.75rem; width: 18px; height: 18px; cursor: pointer;">
                  <span style="font-size: 13px;">NCAA DIVISION 2</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; padding: 0.75rem; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-weight: normal;">
                  <input type="checkbox" value="d3" ${userData.selectedDivisions?.includes('d3') ? 'checked' : ''} style="margin-right: 0.75rem; width: 18px; height: 18px; cursor: pointer;">
                  <span style="font-size: 13px;">NCAA DIVISION 3</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; padding: 0.75rem; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-weight: normal;">
                  <input type="checkbox" value="naia" ${userData.selectedDivisions?.includes('naia') ? 'checked' : ''} style="margin-right: 0.75rem; width: 18px; height: 18px; cursor: pointer;">
                  <span style="font-size: 13px;">NAIA</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; padding: 0.75rem; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-weight: normal;">
                  <input type="checkbox" value="juco" ${userData.selectedDivisions?.includes('juco') ? 'checked' : ''} style="margin-right: 0.75rem; width: 18px; height: 18px; cursor: pointer;">
                  <span style="font-size: 13px;">JUCO</span>
                </label>
              </div>
            </div>
          ` : ''}
        `;
      }

      // STEP 6: Email Review
      if (currentStep === 6) {
        title = 'Email Review (In Progress)';
        html = `
          <div style="text-align: center;">
            <div style="background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); border: 2px solid #93c5fd; border-radius: 16px; padding: 3rem 2rem;">
              <div style="font-size: 4rem; margin-bottom: 1rem;">✉️</div>
              <h2 style="font-size: 20px; font-weight: 700; color: #1d4ed8; margin: 0 0 1rem 0;">Your Email is Being Reviewed</h2>
              <p style="font-size: 14px; color: #1e40af; margin: 0 0 2rem 0; line-height: 1.8;">Our team is crafting a personalized recruiting email based on your profile.</p>
              
              <div style="background: white; border-radius: 12px; padding: 2rem; margin-bottom: 2rem;">
                <div style="font-size: 13px; color: #0f172a; line-height: 1.8;">
                  <div style="margin-bottom: 1.5rem;">
                    <strong style="font-size: 16px;">⏱️ 24-48 Hours</strong><br>
                    <span style="color: #64748b; font-size: 12px;">We'll email you when your email template is ready for review</span>
                  </div>
                  <div style="margin-bottom: 1.5rem;">
                    <strong style="font-size: 16px;">👀 Review & Approve</strong><br>
                    <span style="color: #64748b; font-size: 12px;">You'll see a preview and can confirm or suggest changes</span>
                  </div>
                  <div>
                    <strong style="font-size: 16px;">🚀 Then Proceed</strong><br>
                    <span style="color: #64748b; font-size: 12px;">Once approved, you'll move to campaign status and payment</span>
                  </div>
                </div>
              </div>

              <div style="background: #f0fdf4; border-left: 4px solid #10b981; padding: 1.5rem; border-radius: 8px;">
                <div style="font-size: 12px; color: #065f46; line-height: 1.8;">
                  <strong>📧 Check your email</strong> for updates. You cannot proceed until we notify you that your email is ready!
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // STEP 7: Campaign Status
      if (currentStep === 7) {
        title = 'Campaign Status';
        html = `
          <div style="background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); border: 2px solid #93c5fd; border-radius: 16px; padding: 2rem; text-align: center;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🚀</div>
            <h2 style="font-size: 20px; font-weight: 700; color: #1d4ed8; margin: 0 0 0.75rem 0;">Your Campaign is In Progress</h2>
            <p style="font-size: 14px; color: #1e40af; margin: 0 0 2rem 0;">Your email is being sent to coaches. Once complete, you can proceed to payment.</p>
            
            <div style="background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem;">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; text-align: left;">
                <div>
                  <div style="font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 0.5rem;">PACKAGE</div>
                  <div id="summaryPackage" style="font-size: 16px; font-weight: 700;">Standard - $150</div>
                </div>
                <div>
                  <div style="font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 0.5rem;">DIVISIONS</div>
                  <div id="summaryDivisions" style="font-size: 14px; font-weight: 700;">D1, D2, NAIA</div>
                </div>
              </div>
            </div>

            <div style="background: #f0f9ff; border: 2px solid #bfdbfe; border-radius: 8px; padding: 1rem;">
              <div style="font-size: 12px; color: #1e40af; line-height: 1.8;">
                <strong>📧 We'll notify you via email</strong> when emails have been sent to all coaches. Then you can proceed with payment!
              </div>
            </div>
          </div>
        `;
      }

      document.getElementById('stepTitle').textContent = title;
      document.getElementById('stepContent').innerHTML = html;
    }

    function completeProfile() {
      update(ref(database, 'users/' + currentUser.uid), userData).then(() => {
        alert('✓ Profile complete! Proceeding to payment...');
        window.location.href = 'payment.html';
      }).catch(err => {
        alert('Error: ' + err.message);
      });
    }

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      document.getElementById('userEmail').textContent = '✓ ' + user.email;
      
      get(ref(database, 'users/' + user.uid)).then(snapshot => {
        userData = snapshot.val() || {};
        if (userData.opportunityType) {
          selectedOpportunity = userData.opportunityType;
        }
        displayStep();
      });
    });
  </script>

</body>
</html>
