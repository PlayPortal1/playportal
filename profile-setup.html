<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile - PlayPortal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 13px;
      color: #0f172a;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    textarea {
      resize: vertical;
    }
    .field-hint {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 0.35rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-content">
      <a href="index.html" style="text-decoration: none; cursor: pointer;">
        <img src="logo.png" alt="PlayPortal" style="height: 90px; width: auto;">
      </a>
      <div class="user-info">
        <div id="userEmail">Loading...</div>
        <div style="font-size: 12px; color: #64748b; margin-top: 0.25rem;" id="stepLabel">Step 1 of 7</div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card" style="max-width: 700px; margin: 0 auto;">

      <div class="card-header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h1 style="font-size: 24px; font-weight: 700; margin: 0;">Complete Your Profile</h1>
          <div style="text-align: right;">
            <div style="font-size: 24px; font-weight: 700; color: #2563eb;" id="stepNum">1</div>
            <div style="font-size: 12px; color: #64748b;">of 7</div>
          </div>
        </div>

        <div style="height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
          <div id="progressBar" style="height: 100%; background: #2563eb; width: 14.28%; transition: width 0.3s;"></div>
        </div>
      </div>

      <h2 id="stepTitle" style="font-size: 18px; font-weight: 600; color: #0f172a; margin: 2rem 0 1.5rem 0;"></h2>

      <div id="stepContent" style="margin-bottom: 2rem; min-height: 200px;"></div>

      <div style="display: flex; justify-content: space-between; gap: 1rem; border-top: 2px solid #e2e8f0; padding-top: 2rem;">
        <button onclick="previousStep()" id="prevBtn" class="btn-secondary" style="display: none;" disabled>← PREVIOUS</button>
        <button onclick="nextStep()" id="nextBtn" class="btn-primary" style="margin-left: auto;" disabled>LOADING...</button>
      </div>
    </div>
  </div>

  <script type="module">
    // ---------------------------------------------------------------
    // UI functions are defined immediately (no imports above them),
    // so button clicks can never hit "nextStep is not defined".
    // Firebase is loaded afterwards via dynamic import with a visible
    // error if it fails.
    // ---------------------------------------------------------------

    const firebaseConfig = {
      apiKey: "AIzaSyClVcliLB_iOqbXCilNYSAclIOK5TyBJz0",
      authDomain: "playportal-bf6d4.firebaseapp.com",
      projectId: "playportal-bf6d4",
      storageBucket: "playportal-bf6d4.firebasestorage.app",
      messagingSenderId: "419889829572",
      appId: "1:419889829572:web:f341cf03579997830c5b91",
      databaseURL: "https://playportal-bf6d4-default-rtdb.europe-west1.firebasedatabase.app"
    };

    let currentStep = 1;
    let currentUser = null;
    let userData = {};
    let selectedOpportunity = 'undergraduate';

    // Set after Firebase loads:
    let database = null;
    let ref = null, get = null, update = null;
    let appReady = false;

    // Escapes user data before injecting into HTML attributes/content
    function esc(v) {
      return (v ?? '').toString()
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    window.nextStep = function() {
      if (!appReady) { alert('Still connecting, one moment...'); return; }

      if (!validateStep()) return;
      saveStep();

      // Don't advance the stored step past package selection until payment is made
      let nextStored = currentStep + 1;
      if (currentStep === 5 && userData.status !== 'completed') nextStored = 5;
      if (nextStored > 7) nextStored = 7;
      userData.currentStep = nextStored;

      update(ref(database, 'users/' + currentUser.uid), userData).catch(err => {
        console.error('Error saving:', err);
      });

      if (currentStep === 5 && userData.status !== 'completed') {
        // Payment comes before we write the email
        window.location.href = 'payment.html';
        return;
      }

      if (currentStep < 7) {
        currentStep++;
        displayStep();
      }
    };

    window.previousStep = function() {
      if (!appReady) { alert('Still connecting, one moment...'); return; }
      saveStep();
      update(ref(database, 'users/' + currentUser.uid), userData).catch(err => {
        console.error('Error saving:', err);
      });

      if (currentStep > 1) {
        currentStep--;
        displayStep();
      }
    };

    window.selectOpportunity = function(value) {
      selectedOpportunity = value;
      document.querySelectorAll('input[name="opportunity"]').forEach(el => {
        el.checked = el.value === value;
      });
    };

    window.selectPackage = function(pkg) {
      userData.package = pkg;
      updatePackageDisplay(pkg);
      displayStep();
    };

    function updatePackageDisplay(pkg) {
      const cards = document.querySelectorAll('[data-package]');
      cards.forEach(card => {
        if (card.dataset.package === pkg) {
          card.style.borderColor = '#ff6b35';
          card.style.background = '#fff7ed';
        } else {
          card.style.borderColor = '#cbd5e1';
          card.style.background = 'white';
        }
      });
    }

    function validateStep() {
      const step = currentStep;

      if (step === 1) {
        if (!document.getElementById('firstName')?.value || !document.getElementById('lastName')?.value ||
            !document.getElementById('dob')?.value || document.getElementById('gender')?.value === 'Select Gender' ||
            !document.getElementById('country')?.value || document.getElementById('budget')?.value === 'Select Budget') {
          alert('Please fill in all fields');
          return false;
        }
      }

      if (step === 3) {
        if (!document.getElementById('school')?.value || !document.getElementById('gradYear')?.value ||
            !document.getElementById('gpa')?.value) {
          alert('Please fill in all fields');
          return false;
        }
      }

      if (step === 4) {
        if (!document.getElementById('yearsPlaying')?.value || !document.getElementById('utr')?.value ||
            !document.getElementById('wtn')?.value) {
          alert('Please fill in all fields');
          return false;
        }
        const video = document.getElementById('videoLink')?.value.trim();
        if (video && !/^https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(video)) {
          alert('Please enter a valid YouTube link (starting with https://www.youtube.com/ or https://youtu.be/)');
          return false;
        }
      }

      if (step === 5) {
        if (!userData.package) {
          alert('Please select a package');
          return false;
        }

        const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;

        if (userData.package === 'basic' && checked !== 1) {
          alert('❌ Basic package: Please select exactly 1 division');
          return false;
        }

        if (userData.package === 'standard' && checked !== 3) {
          alert('❌ Standard package: Please select exactly 3 divisions');
          return false;
        }
      }

      if (step === 6) {
        alert('⏳ Your email is being reviewed by our team. You cannot proceed until it\'s approved. We\'ll notify you via email when it\'s ready!');
        return false;
      }

      return true;
    }

    function saveStep() {
      const step = currentStep;

      if (step === 1) {
        userData.firstName = document.getElementById('firstName')?.value;
        userData.lastName = document.getElementById('lastName')?.value;
        userData.dob = document.getElementById('dob')?.value;
        userData.gender = document.getElementById('gender')?.value;
        userData.country = document.getElementById('country')?.value;
        userData.budget = document.getElementById('budget')?.value;
      }

      if (step === 2) {
        userData.opportunityType = selectedOpportunity;
      }

      if (step === 3) {
        userData.school = document.getElementById('school')?.value;
        userData.gradYear = document.getElementById('gradYear')?.value;
        userData.gpa = document.getElementById('gpa')?.value;
        userData.academicAchievements = document.getElementById('achievements')?.value || '';

        if (selectedOpportunity === 'undergraduate') {
          userData.sat = document.getElementById('sat')?.value || '';
        } else if (selectedOpportunity === 'transfer') {
          userData.currentDegree = document.getElementById('currentDegree')?.value || '';
        } else {
          userData.degreeStudied = document.getElementById('degreeStudied')?.value || '';
          userData.degreeWantToStudy = document.getElementById('degreeWantToStudy')?.value || '';
        }
      }

      if (step === 4) {
        userData.yearsPlaying = document.getElementById('yearsPlaying')?.value;
        userData.playingHand = document.getElementById('playingHand')?.value;
        userData.utr = document.getElementById('utr')?.value;
        userData.wtn = document.getElementById('wtn')?.value;
        userData.videoLink = document.getElementById('videoLink')?.value.trim() || '';
        userData.tennisAchievements = document.getElementById('tennisAchievements')?.value || '';
      }

      if (step === 5) {
        const selected = [];
        document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
          selected.push(cb.value);
        });
        userData.selectedDivisions = userData.package === 'premium' ? ['d1', 'd2', 'd3', 'naia', 'juco'] : selected;
      }
    }

    function displayStep() {
      let title = '';
      let html = '';

      document.getElementById('stepNum').textContent = currentStep;
      document.getElementById('stepLabel').textContent = 'Step ' + currentStep + ' of 7';
      document.getElementById('progressBar').style.width = ((currentStep - 1) / 6 * 100) + '%';
      document.getElementById('prevBtn').style.display = currentStep === 1 ? 'none' : 'block';

      let nextBtnText = 'NEXT STEP →';
      if (currentStep === 5 && userData.status !== 'completed') nextBtnText = 'CONTINUE TO PAYMENT →';

      document.getElementById('nextBtn').textContent = nextBtnText;
      document.getElementById('nextBtn').style.display = currentStep === 7 ? 'none' : 'block';
      document.getElementById('nextBtn').disabled = currentStep === 6;
      if (currentStep === 6) {
        document.getElementById('nextBtn').style.opacity = '0.5';
        document.getElementById('nextBtn').style.cursor = 'not-allowed';
      } else {
        document.getElementById('nextBtn').style.opacity = '1';
        document.getElementById('nextBtn').style.cursor = 'pointer';
      }

      // STEP 1: Personal Info
      if (currentStep === 1) {
        title = 'Personal Information';
        html = `
          <div class="grid-2">
            <div>
              <label>First Name</label>
              <input type="text" id="firstName" placeholder="John" value="${esc(userData.firstName)}">
            </div>
            <div>
              <label>Last Name</label>
              <input type="text" id="lastName" placeholder="Smith" value="${esc(userData.lastName)}">
            </div>
            <div>
              <label>Date of Birth</label>
              <input type="date" id="dob" value="${esc(userData.dob)}">
            </div>
            <div>
              <label>Gender</label>
              <select id="gender">
                <option ${userData.gender === 'Select Gender' || !userData.gender ? 'selected' : ''}>Select Gender</option>
                <option ${userData.gender === 'Male' ? 'selected' : ''}>Male</option>
                <option ${userData.gender === 'Female' ? 'selected' : ''}>Female</option>
              </select>
            </div>
            <div>
              <label>Country</label>
              <input type="text" id="country" placeholder="e.g., Portugal" value="${esc(userData.country)}">
            </div>
            <div>
              <label>Yearly Budget (USD)</label>
              <select id="budget">
                <option ${!userData.budget || userData.budget === 'Select Budget' ? 'selected' : ''}>Select Budget</option>
                <option ${userData.budget === 'Under $10,000' ? 'selected' : ''}>Under $10,000</option>
                <option ${userData.budget === '$10,000 - $20,000' ? 'selected' : ''}>$10,000 - $20,000</option>
                <option ${userData.budget === '$20,000 - $30,000' ? 'selected' : ''}>$20,000 - $30,000</option>
                <option ${userData.budget === '$30,000 - $40,000' ? 'selected' : ''}>$30,000 - $40,000</option>
                <option ${userData.budget === '$40,000 - $60,000' ? 'selected' : ''}>$40,000 - $60,000</option>
                <option ${userData.budget === '$60,000+' ? 'selected' : ''}>$60,000+</option>
              </select>
            </div>
            <div style="grid-column: 1 / -1;">
              <div class="field-hint">💡 Your budget is how much your family can invest per year toward tuition and expenses. Sharing it helps coaches match you with realistic scholarship offers — it's one of the first things they ask.</div>
            </div>
          </div>
        `;
      }

      // STEP 2: Opportunity Type
      if (currentStep === 2) {
        title = 'Opportunity Type';
        html = `
          <p style="font-size: 14px; color: #475569; margin-bottom: 1.5rem;">Which opportunity are you seeking?</p>
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div style="border: 2px solid #2563eb; background: #f0f7ff; border-radius: 12px; padding: 1.5rem; cursor: pointer;" onclick="selectOpportunity('undergraduate')">
              <input type="radio" name="opportunity" value="undergraduate" ${selectedOpportunity === 'undergraduate' ? 'checked' : ''}>
              <label style="cursor: pointer; margin: 0; text-transform: none; font-weight: 700; display: inline; margin-left: 0.5rem;">Undergraduate Playing</label>
              <p style="font-size: 12px; color: #64748b; margin: 0.5rem 0 0 1.5rem;">For high school students seeking to play at college</p>
            </div>
            <div style="border: 2px solid #cbd5e1; border-radius: 12px; padding: 1.5rem; cursor: pointer;" onclick="selectOpportunity('transfer')">
              <input type="radio" name="opportunity" value="transfer" ${selectedOpportunity === 'transfer' ? 'checked' : ''}>
              <label style="cursor: pointer; margin: 0; text-transform: none; font-weight: 700; display: inline; margin-left: 0.5rem;">Transfer Playing</label>
              <p style="font-size: 12px; color: #64748b; margin: 0.5rem 0 0 1.5rem;">For college students transferring to another school</p>
            </div>
            <div style="border: 2px solid #cbd5e1; border-radius: 12px; padding: 1.5rem; cursor: pointer;" onclick="selectOpportunity('graduate')">
              <input type="radio" name="opportunity" value="graduate" ${selectedOpportunity === 'graduate' ? 'checked' : ''}>
              <label style="cursor: pointer; margin: 0; text-transform: none; font-weight: 700; display: inline; margin-left: 0.5rem;">Graduate Playing</label>
              <p style="font-size: 12px; color: #64748b; margin: 0.5rem 0 0 1.5rem;">For college graduates pursuing graduate degrees</p>
            </div>
            <div style="border: 2px solid #cbd5e1; border-radius: 12px; padding: 1.5rem; cursor: pointer;" onclick="selectOpportunity('coach')">
              <input type="radio" name="opportunity" value="coach" ${selectedOpportunity === 'coach' ? 'checked' : ''}>
              <label style="cursor: pointer; margin: 0; text-transform: none; font-weight: 700; display: inline; margin-left: 0.5rem;">Graduate Assistant Coach</label>
              <p style="font-size: 12px; color: #64748b; margin: 0.5rem 0 0 1.5rem;">Seeking coaching positions while studying</p>
            </div>
          </div>
        `;
      }

      // STEP 3: Academic Info
      if (currentStep === 3) {
        title = 'Academic Information';
        let schoolLabel = 'High School';
        let schoolPlaceholder = 'e.g., Lincoln High School';
        let extraFields = '';

        if (selectedOpportunity === 'transfer') {
          schoolLabel = 'Current University';
          schoolPlaceholder = 'e.g., University of Florida';
          extraFields = `
            <div>
              <label>Degree You're Studying</label>
              <input type="text" id="currentDegree" placeholder="e.g., Business Administration" value="${esc(userData.currentDegree)}">
            </div>
          `;
        } else if (selectedOpportunity === 'graduate' || selectedOpportunity === 'coach') {
          schoolLabel = 'University';
          schoolPlaceholder = 'e.g., University of Florida';
          extraFields = `
            <div>
              <label>Degree You Studied</label>
              <input type="text" id="degreeStudied" placeholder="e.g., Economics" value="${esc(userData.degreeStudied)}">
            </div>
            <div>
              <label>Degree You Want to Study</label>
              <input type="text" id="degreeWantToStudy" placeholder="e.g., MBA" value="${esc(userData.degreeWantToStudy)}">
            </div>
          `;
        }

        html = `
          <div class="grid-2">
            <div>
              <label>${schoolLabel}</label>
              <input type="text" id="school" placeholder="${schoolPlaceholder}" value="${esc(userData.school)}">
            </div>
            <div>
              <label>Graduation Year</label>
              <input type="number" id="gradYear" placeholder="2027" value="${esc(userData.gradYear)}">
            </div>
            <div>
              <label>GPA</label>
              <input type="number" id="gpa" step="0.01" placeholder="3.8" value="${esc(userData.gpa)}">
            </div>
            ${selectedOpportunity === 'undergraduate' ? `
            <div>
              <label>SAT Score</label>
              <input type="number" id="sat" placeholder="1390" value="${esc(userData.sat)}">
            </div>
            ` : ''}
            ${extraFields}
            <div style="grid-column: 1 / -1;">
              <label>Academic Achievements</label>
              <textarea id="achievements" placeholder="Honors, awards, relevant courses..." style="height: 100px;">${esc(userData.academicAchievements)}</textarea>
            </div>
          </div>
        `;
      }

      // STEP 4: Tennis Info
      if (currentStep === 4) {
        title = 'Tennis Information';
        html = `
          <div class="grid-2">
            <div>
              <label>Years Playing Tennis</label>
              <input type="number" id="yearsPlaying" placeholder="8" value="${esc(userData.yearsPlaying)}">
            </div>
            <div>
              <label>Playing Hand</label>
              <select id="playingHand">
                <option ${userData.playingHand === 'Right' || !userData.playingHand ? 'selected' : ''}>Right</option>
                <option ${userData.playingHand === 'Left' ? 'selected' : ''}>Left</option>
              </select>
            </div>
            <div>
              <label>UTR Rating</label>
              <input type="number" id="utr" step="0.1" placeholder="10.2" value="${esc(userData.utr)}">
            </div>
            <div>
              <label>WTN Rating</label>
              <input type="number" id="wtn" step="0.1" placeholder="13.5" value="${esc(userData.wtn)}">
            </div>
            <div style="grid-column: 1 / -1;">
              <label>YouTube Video Link</label>
              <input type="url" id="videoLink" placeholder="https://www.youtube.com/watch?v=..." value="${esc(userData.videoLink)}">
              <div class="field-hint">🎥 Highly recommended — match or practice footage is usually the first thing coaches ask for. Upload your video to YouTube (unlisted works fine) and paste the link here.</div>
            </div>
            <div style="grid-column: 1 / -1;">
              <label>Tennis Achievements</label>
              <textarea id="tennisAchievements" placeholder="Tournament wins, rankings, titles, records..." style="height: 100px;">${esc(userData.tennisAchievements)}</textarea>
            </div>
          </div>
        `;
      }

      // STEP 5: Package Selection
      if (currentStep === 5) {
        title = 'Select Your Package';
        if (userData.status === 'completed') {
          const paidNames = { basic: 'Basic — $99', standard: 'Standard — $150', premium: 'Premium — $215' };
          const paidDivs = (userData.selectedDivisions || []).map(d => d.toUpperCase()).join(', ');
          html = `
            <div style="background: #f0fdf4; border: 2px solid #bbf7d0; border-radius: 12px; padding: 1.5rem;">
              <div style="font-weight: 700; margin-bottom: 0.5rem; color: #065f46;">\u2705 Package purchased</div>
              <div style="font-size: 13px; color: #475569;">${paidNames[userData.package] || 'Package'} \u2014 Divisions: ${esc(paidDivs) || 'N/A'}.<br>Your package is locked in. Continue to the next step to review your recruiting email.</div>
            </div>
          `;
        } else {
        html = `
          <p style="font-size: 14px; color: #475569; margin-bottom: 1.5rem;">Choose your package:</p>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
            <div data-package="basic" style="border: ${userData.package === 'basic' ? '3px solid #ff6b35' : '2px solid #cbd5e1'}; background: ${userData.package === 'basic' ? '#fff7ed' : 'white'}; border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer;" onclick="selectPackage('basic')">
              <div style="font-size: 16px; font-weight: 700; margin-bottom: 0.75rem;">BASIC</div>
              <div style="font-size: 24px; font-weight: 800; color: #2563eb; margin-bottom: 0.5rem;">$99</div>
              <div style="font-size: 12px; color: #64748b;">1 Division</div>
            </div>
            <div data-package="standard" style="border: ${userData.package === 'standard' ? '3px solid #ff6b35' : '2px solid #cbd5e1'}; background: ${userData.package === 'standard' ? '#fff7ed' : 'white'}; border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer;" onclick="selectPackage('standard')">
              <div style="font-size: 11px; font-weight: 700; color: #2563eb; margin-bottom: 0.75rem;">RECOMMENDED</div>
              <div style="font-size: 16px; font-weight: 700; margin-bottom: 0.75rem;">STANDARD</div>
              <div style="font-size: 24px; font-weight: 800; color: #2563eb; margin-bottom: 0.5rem;">$150</div>
              <div style="font-size: 12px; color: #64748b;">3 Divisions</div>
            </div>
            <div data-package="premium" style="border: ${userData.package === 'premium' ? '3px solid #ff6b35' : '2px solid #cbd5e1'}; background: ${userData.package === 'premium' ? '#fff7ed' : 'white'}; border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer;" onclick="selectPackage('premium')">
              <div style="font-size: 16px; font-weight: 700; margin-bottom: 0.75rem;">PREMIUM</div>
              <div style="font-size: 24px; font-weight: 800; color: #2563eb; margin-bottom: 0.5rem;">$215</div>
              <div style="font-size: 12px; color: #64748b;">All Divisions</div>
              <div style="font-size: 11px; color: #64748b; margin-top: 0.75rem;">(NCAA D1, NCAA D2, NCAA D3, NAIA, JUCO)</div>
            </div>
          </div>

          ${userData.package === 'basic' || userData.package === 'standard' ? `
            <div style="background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 1.5rem;">
              <label style="display: block; font-weight: 700; margin-bottom: 1rem; color: #0f172a;">Select divisions to contact:</label>
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <label style="display: flex; align-items: center; cursor: pointer; padding: 0.75rem; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-weight: normal;">
                  <input type="checkbox" value="d1" ${userData.selectedDivisions?.includes('d1') ? 'checked' : ''} style="margin-right: 0.75rem; width: 18px; height: 18px; cursor: pointer;">
                  <span style="font-size: 13px;">NCAA DIVISION 1</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; padding: 0.75rem; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-weight: normal;">
                  <input type="checkbox" value="d2" ${userData.selectedDivisions?.includes('d2') ? 'checked' : ''} style="margin-right: 0.75rem; width: 18px; height: 18px; cursor: pointer;">
                  <span style="font-size: 13px;">NCAA DIVISION 2</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; padding: 0.75rem; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-weight: normal;">
                  <input type="checkbox" value="d3" ${userData.selectedDivisions?.includes('d3') ? 'checked' : ''} style="margin-right: 0.75rem; width: 18px; height: 18px; cursor: pointer;">
                  <span style="font-size: 13px;">NCAA DIVISION 3</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; padding: 0.75rem; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-weight: normal;">
                  <input type="checkbox" value="naia" ${userData.selectedDivisions?.includes('naia') ? 'checked' : ''} style="margin-right: 0.75rem; width: 18px; height: 18px; cursor: pointer;">
                  <span style="font-size: 13px;">NAIA</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; padding: 0.75rem; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-weight: normal;">
                  <input type="checkbox" value="juco" ${userData.selectedDivisions?.includes('juco') ? 'checked' : ''} style="margin-right: 0.75rem; width: 18px; height: 18px; cursor: pointer;">
                  <span style="font-size: 13px;">JUCO</span>
                </label>
              </div>
            </div>
          ` : ''}
        `;
        }
      }

      // STEP 6: Email Review
      if (currentStep === 6) {
        title = 'Email Review';

        if (userData.emailTemplate && userData.emailTemplate.content) {
          html = `
            <div style="text-align: center;">
              <div style="background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); border: 2px solid #93c5fd; border-radius: 16px; padding: 3rem 2rem;">
                <div style="font-size: 4rem; margin-bottom: 1rem;">✉️</div>
                <h2 style="font-size: 20px; font-weight: 700; color: #1d4ed8; margin: 0 0 1rem 0;">Your Email Template is Ready!</h2>
                <p style="font-size: 14px; color: #1e40af; margin: 0 0 2rem 0;">Review the template below. You can approve it or suggest changes.</p>

                <div style="background: white; border-radius: 12px; padding: 2rem; margin-bottom: 2rem; text-align: left;">
                  <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; font-size: 13px; color: #475569; line-height: 1.8; white-space: pre-wrap; max-height: 300px; overflow-y: auto;">
                    ${esc(userData.emailTemplate.content)}
                  </div>

                  <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-weight: 700; margin-bottom: 0.5rem; color: #0f172a;">Suggested Changes (Optional)</label>
                    <textarea id="emailChanges" placeholder="If you want to suggest changes, write them here..." style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 6px; height: 100px;"></textarea>
                  </div>

                  <div style="display: flex; gap: 1rem;">
                    <button onclick="rejectEmailTemplate()" class="btn-secondary" style="flex: 1; padding: 0.75rem;">✏️ Suggest Changes</button>
                    <button onclick="approveEmailTemplate()" class="btn-primary" style="flex: 1; padding: 0.75rem;">✅ Approve Template</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        } else {
          html = `
            <div style="text-align: center;">
              <div style="background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); border: 2px solid #93c5fd; border-radius: 16px; padding: 3rem 2rem;">
                <div style="font-size: 4rem; margin-bottom: 1rem;">⏳</div>
                <h2 style="font-size: 20px; font-weight: 700; color: #1d4ed8; margin: 0 0 1rem 0;">Email Template Coming Soon</h2>
                <p style="font-size: 14px; color: #1e40af; margin: 0 0 2rem 0; line-height: 1.8;">Our admin team is creating your personalized recruiting email. You'll receive a notification and email when it's ready for review.</p>

                <div style="background: white; border-radius: 12px; padding: 2rem;">
                  <div style="font-size: 13px; color: #0f172a; line-height: 1.8;">
                    <div style="margin-bottom: 1.5rem;">
                      <strong style="font-size: 16px;">⏱️ Expected: 24-48 Hours</strong><br>
                      <span style="color: #64748b; font-size: 12px;">We're working on crafting the perfect email for you</span>
                    </div>
                    <div style="background: #f0fdf4; border-left: 4px solid #10b981; padding: 1.5rem; border-radius: 8px;">
                      <div style="font-size: 12px; color: #065f46;">
                        <strong>📧 Check back soon!</strong><br>
                        Once ready, you'll see the template here and can review or suggest changes.
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
      }

      // STEP 7: Campaign Status
      if (currentStep === 7) {
        title = 'Campaign Status';

        if (userData.emailsSent) {
          const credsArr = userData.credentials ? Object.values(userData.credentials) : [];
          const credsHtml = credsArr.length > 0 ? `
              <div style="background: white; border-radius: 12px; padding: 1.5rem; margin-top: 1.5rem; text-align: left;">
                <div style="font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 1rem;">YOUR RECRUITING INBOX</div>
                ${credsArr.map(cred => `
                  <div style="margin-bottom: 1rem;">
                    <div style="font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase;">Email Account</div>
                    <div style="font-size: 14px; font-weight: 600; word-break: break-all;">${esc(cred.email)}</div>
                    <div style="font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 0.5rem;">Password</div>
                    <div style="font-size: 14px; font-weight: 600; word-break: break-all; font-family: monospace;">${esc(cred.password)}</div>
                  </div>
                `).join('')}
              </div>` : '';
          html = `
            <div style="background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); border: 2px solid #93c5fd; border-radius: 16px; padding: 2rem; text-align: center;">
              <div style="font-size: 3rem; margin-bottom: 1rem;">🚀</div>
              <h2 style="font-size: 20px; font-weight: 700; color: #1d4ed8; margin: 0 0 0.75rem 0;">Your Campaign Has Launched!</h2>
              <p style="font-size: 14px; color: #1e40af; margin: 0 0 2rem 0;">Your email has been sent to coaches. Watch your recruiting inbox for replies.</p>

              <div style="background: white; border-radius: 12px; padding: 1.5rem;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; text-align: left;">
                  <div>
                    <div style="font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 0.5rem;">PACKAGE</div>
                    <div id="summaryPackage" style="font-size: 16px; font-weight: 700;">${userData.package === 'basic' ? 'Basic - $99' : userData.package === 'premium' ? 'Premium - $215' : 'Standard - $150'}</div>
                  </div>
                  <div>
                    <div style="font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 0.5rem;">DIVISIONS</div>
                    <div id="summaryDivisions" style="font-size: 14px; font-weight: 700;">${userData.selectedDivisions?.join(', ').toUpperCase() || 'N/A'}</div>
                  </div>
                </div>
              </div>

              ${credsHtml}

              <div style="background: #f0fdf4; border: 2px solid #bbf7d0; border-radius: 8px; padding: 1rem; margin-top: 1.5rem;">
                <div style="font-size: 12px; color: #065f46;">
                  <strong>✅ All set!</strong> Log in to your recruiting inbox and reply to coaches as their responses come in.
                </div>
              </div>
            </div>
          `;
        } else {
          html = `
            <div style="background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); border: 2px solid #93c5fd; border-radius: 16px; padding: 2rem; text-align: center;">
              <div style="font-size: 3rem; margin-bottom: 1rem;">⏳</div>
              <h2 style="font-size: 20px; font-weight: 700; color: #1d4ed8; margin: 0 0 1rem 0;">Campaign In Progress</h2>
              <p style="font-size: 14px; color: #1e40af; margin: 0 0 2rem 0; line-height: 1.8;">Your email is being sent to coaches. Waiting for admin confirmation...</p>

              <div style="background: white; border-radius: 12px; padding: 2rem;">
                <div style="font-size: 13px; color: #0f172a; line-height: 1.8;">
                  <div style="margin-bottom: 1.5rem;">
                    <strong style="font-size: 16px;">📧 Emails Sending</strong><br>
                    <span style="color: #64748b; font-size: 12px;">Your personalized email is being sent to coaches</span>
                  </div>
                  <div style="margin-bottom: 1.5rem;">
                    <strong style="font-size: 16px;">⏱️ Almost There</strong><br>
                    <span style="color: #64748b; font-size: 12px;">Admin will confirm when emails are sent</span>
                  </div>
                  <div style="background: #f0fdf4; border-left: 4px solid #10b981; padding: 1.5rem; border-radius: 8px;">
                    <div style="font-size: 12px; color: #065f46;">
                      <strong>📧 Once complete,</strong> your recruiting inbox credentials will appear here and replies will start arriving.
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

      }

      document.getElementById('stepTitle').textContent = title;
      document.getElementById('stepContent').innerHTML = html;
    }

    window.approveEmailTemplate = function() {
      update(ref(database, 'users/' + currentUser.uid), {
        emailApproved: true,
        emailApprovedAt: new Date().toISOString(),
        currentStep: 7
      }).then(() => {
        alert('✅ Email approved! Moving to campaign...');
        currentStep = 7;
        displayStep();
      });
    };

    window.rejectEmailTemplate = function() {
      const changes = document.getElementById('emailChanges').value;
      if (!changes.trim()) {
        alert('Please write your suggested changes');
        return;
      }
      update(ref(database, 'users/' + currentUser.uid), {
        emailSuggestedChanges: changes,
        emailChangesRequestedAt: new Date().toISOString()
      }).then(() => {
        alert('✅ Suggestions sent to admin! They will update the template.');
        displayStep();
      });
    };

    async function startApp() {
      try {
        const [appMod, authMod, dbMod] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js")
        ]);

        const app = appMod.initializeApp(firebaseConfig);
        const auth = authMod.getAuth(app);
        database = dbMod.getDatabase(app);
        ref = dbMod.ref;
        get = dbMod.get;
        update = dbMod.update;

        authMod.onAuthStateChanged(auth, user => {
          if (!user) {
            window.location.href = 'login.html';
            return;
          }
          currentUser = user;
          document.getElementById('userEmail').textContent = '\u2713 ' + user.email;

          get(ref(database, 'users/' + user.uid)).then(snapshot => {
            userData = snapshot.val() || {};
            if (userData.opportunityType) {
              selectedOpportunity = userData.opportunityType;
            }

            // Auto-resume to last step
            if (userData.currentStep) {
              currentStep = userData.currentStep;
            } else {
              if (userData.emailsSent) {
                currentStep = 7;
              } else if (userData.emailApproved) {
                currentStep = 7;
              } else if (userData.emailTemplate) {
                currentStep = 6;
              } else if (userData.selectedDivisions) {
                currentStep = 5;
              } else if (userData.wtn) {
                currentStep = 4;
              } else if (userData.gpa) {
                currentStep = 3;
              } else if (userData.opportunityType) {
                currentStep = 2;
              }
            }

            // Under the pay-first flow, nobody proceeds past package selection unpaid
            if (currentStep > 5 && userData.status !== 'completed') {
              currentStep = 5;
            }

            appReady = true;
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('prevBtn').disabled = false;
            displayStep();
          }).catch(err => {
            console.error('Error loading profile:', err);
            showFatalError('Could not load your profile data. Please refresh the page.');
          });
        });
      } catch (err) {
        console.error('Firebase failed to load:', err);
        showFatalError('Could not connect to the server. Check your internet connection (and any ad-blocker), then refresh the page.');
      }
    }

    function showFatalError(message) {
      document.getElementById('userEmail').textContent = '\u26a0 Connection error';
      const content = document.getElementById('stepContent');
      content.innerHTML = '<div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 1.5rem; font-size: 14px; color: #b91c1c;">' + esc(message) + '</div>';
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('nextBtn').textContent = 'NEXT STEP \u2192';
    }

    startApp();
  </script>

</body>
</html>
